<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在跳转...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f5f5;
      color: #333;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      max-width: 480px;
      width: 90%;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #1890ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .message {
      font-size: 16px;
      color: #666;
      margin-bottom: 8px;
    }
    .target-url {
      font-size: 13px;
      color: #999;
      word-break: break-all;
      margin-top: 12px;
    }
    .error {
      color: #ff4d4f;
    }
    .error-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .retry-link {
      display: inline-block;
      margin-top: 16px;
      color: #1890ff;
      text-decoration: none;
      font-size: 14px;
    }
    .retry-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="spinner"></div>
    <p class="message">正在解析链接，请稍候...</p>
  </div>

  <script>
    // ====== 配置：后端 API 地址（改为你的实际后端域名） ======
    const API_BASE = 'https://your-api-domain.com';

    (async function () {
      const app = document.getElementById('app');

      // 1. 从 URL 路径中提取短码
      const path = window.location.pathname.replace(/^\/+|\/+$/g, '');
      if (!path) {
        showError('链接无效：未包含短码');
        return;
      }
      const shortCode = path.split('/')[0];

      // 2. 调用后端 resolve 接口
      try {
        
        /*
        const resp = await fetch(`${API_BASE}/api/resolve/${encodeURIComponent(shortCode)}`);

        if (!resp.ok) {
          if (resp.status === 404) {
            showError('该短链不存在或已过期');
          } else {
            showError(`解析失败 (${resp.status})`);
          }
          return;
        }

        const data = await resp.json();
        */
        const targetUrl = "https://baidu.com?wd="+shortCode;//data.original_url;

        if (!targetUrl) {
          showError('解析结果异常');
          return;
        }

        // 3. 显示目标地址并跳转
        app.innerHTML = `
          <div class="spinner"></div>
          <p class="message">正在跳转...</p>
          <p class="target-url">${escapeHtml(targetUrl)}</p>
        `;
        window.location.replace(targetUrl);

      } catch (err) {
        showError('网络错误，无法解析短链');
      }
    })();

    function showError(msg) {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="error-icon">⚠️</div>
        <p class="message error">${escapeHtml(msg)}</p>
        <a href="javascript:location.reload()" class="retry-link">重试</a>
      `;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
